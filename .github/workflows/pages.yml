name: Test and deploy MANTA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test application and backend
        run: npm test
      - name: Check application syntax
        run: |
          node --check dist/app.mjs
          node --check dist/workspace.mjs
          node --check dist/guide.mjs
          node --check dist/showcase.mjs
          node --check dist/transfers.mjs
          node --check backend.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
